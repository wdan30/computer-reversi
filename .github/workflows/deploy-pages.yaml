name: Deploy WebGL to Pages
on:
  push:
    branches: ["main"] # Change this if your default branch is named 'master'
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './Builds/computer-reversi-webgl-1' # Points exactly to your folder
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
